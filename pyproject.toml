[project]
name = "filesystem-supertool2"
version = "0.1.0"
description = "MCP server combining filesystem operations with LSP-powered semantic code capabilities"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0.0",
    "lsprotocol",
    "overrides",
    "pathspec",
    "psutil",
    "requests",
    "typing_extensions",
    "charset_normalizer",
    "openpyxl",
    "python-docx",
    "xlrd",
]

[project.scripts]
filesystem-supertool2 = "filesystem_supertool2.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filesystem_supertool2"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: needs network access + uv/uvx on PATH; spawns a real language server process (excluded by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
# solidlsp/ is vendored (extracted from oraios/serena, see NOTICE.md), not our code --
# excluded so we don't force unrelated style reformatting onto adopted upstream source.
# Exception: _compat.py (our own compatibility shims, physically inside this directory
# only because that's where the imports it replaces live) is not covered by this
# exclusion pattern and must be linted explicitly:
#   uv run ruff check src/filesystem_supertool2/solidlsp/_compat.py
extend-exclude = ["src/filesystem_supertool2/solidlsp"]
