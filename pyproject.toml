[project]
name = "filesystem-supertool2"
version = "0.1.0"
description = "MCP server combining filesystem operations with LSP-powered semantic code capabilities"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0.0",
    "lsprotocol",
    "overrides",
    "pathspec",
    "psutil",
    "requests",
    "typing_extensions",
    "charset_normalizer",
]

[project.scripts]
filesystem-supertool2 = "filesystem_supertool2.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filesystem_supertool2"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
